[project]
name = "responses-sagemaker"
version = "0.1.0"
description = "An httpx transport that lets the OpenAI client call a Responses API served on Amazon SageMaker."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    # SigV4 signing; crt covers `aws login` profiles.
    "boto3[crt]>=1.40",
]

[dependency-groups]
dev = [
    "openai>=2.0.0",
    "pytest>=9.1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["responses_sagemaker"]
